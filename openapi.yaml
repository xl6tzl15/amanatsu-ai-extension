  /api/v1/debug/object:
    get:
      summary: "One GameObject: path, scene, layer, tag, parent, local and world transform, components with ids, children"
      x-mutates: false
      x-scene: "any"
      parameters:
        - in: "query"
          name: "id"
          required: false
          schema:
            type: "integer"
          description: "GameObject or component instance id"
        - in: "query"
          name: "path"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The object was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/debug/component:
    get:
      summary: "Field values of one component without calling native getters (only a fixed list of side-effect-free getters); referenced Unity objects are given as ids"
      x-mutates: false
      x-scene: "any"
      parameters:
        - in: "query"
          name: "id"
          required: true
          schema:
            type: "integer"
          description: "component instance id from debug/object"
        - in: "query"
          name: "path"
          required: false
          schema:
            type: "string"
          description: "field path to look inside, e.g. m_OnClick.m_PersistentCalls.m_Calls[0]"
        - in: "query"
          name: "depth"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 3
            default: 1
        - in: "query"
          name: "getters"
          required: false
          schema:
            type: "boolean"
            default: true
          description: "include the side-effect-free getters"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The component, or a field or element on path, was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/debug/find:
    get:
      summary: "GameObjects in loaded scenes by component type (exact full or short name) and/or name substring"
      x-mutates: false
      x-scene: "any"
      parameters:
        - in: "query"
          name: "type"
          required: false
          schema:
            type: "string"
        - in: "query"
          name: "name"
          required: false
          schema:
            type: "string"
        - in: "query"
          name: "inactive"
          required: false
          schema:
            type: "boolean"
            default: true
        - in: "query"
          name: "limit"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
