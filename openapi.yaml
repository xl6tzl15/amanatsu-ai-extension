  /api/v1/debug/wait:
    post:
      summary: "Wait until every given condition holds (checked once per frame); 408 with the current state on timeout"
      x-mutates: false
      x-scene: "any"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                scene:
                  type: "string"
                  description: "active scene name, e.g. Title, CustomScene, map000"
                humanCountAtLeast:
                  type: "integer"
                  minimum: 0
                creatorReady:
                  type: "boolean"
                button:
                  $ref: "#/components/schemas/ButtonSelector"
                log:
                  type: "object"
                  description: "a log line written after the wait started (or after since)"
                  properties:
                    contains:
                      type: "string"
                    source:
                      type: "string"
                    level:
                      type: "string"
                      enum:
                        - "fatal"
                        - "error"
                        - "warning"
                        - "message"
                        - "info"
                        - "debug"
                    since:
                      type: "integer"
                  anyOf:
                    - required:
                        - "contains"
                    - required:
                        - "source"
                    - required:
                        - "level"
                event:
                  type: "object"
                  description: "a debug/events entry added after the wait started (or after since)"
                  properties:
                    type:
                      oneOf:
                        - type: "string"
                        - type: "array"
                          minItems: 1
                          items:
                            type: "string"
                    contains:
                      type: "string"
                    since:
                      type: "integer"
                  anyOf:
                    - required:
                        - "type"
                    - required:
                        - "contains"
                timeoutMs:
                  type: "integer"
                  minimum: 0
                  maximum: 120000
                  default: 10000
              anyOf:
                - required:
                    - "scene"
                - required:
                    - "humanCountAtLeast"
                - required:
                    - "creatorReady"
                - required:
                    - "button"
                - required:
                    - "log"
                - required:
                    - "event"
      responses:
        "200":
          description: "Every condition held"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitResult"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "408":
          description: "The conditions did not hold before timeoutMs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitResult"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within 130 seconds (the longest wait plus ten seconds)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
