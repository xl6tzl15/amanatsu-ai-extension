        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                region:
                  $ref: "#/components/schemas/KitRegion"
                name:
                  type: "string"
                exclude:
                  type: "array"
                  items:
                    type: "string"
                  description: "shapes, parts, colors or field names"
                dryRun:
                  type: "boolean"
              required:
                - "region"
                - "name"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/creator/kit-delete:
    post:
      summary: "Delete a kit"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                region:
                  $ref: "#/components/schemas/KitRegion"
                name:
                  type: "string"
              required:
                - "region"
