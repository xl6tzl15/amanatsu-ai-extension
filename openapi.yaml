              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/debug/scenes:
    get:
      summary: "Loaded scenes (and DontDestroyOnLoad) with handle, build index and root object count"
      x-mutates: false
      x-scene: "any"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
