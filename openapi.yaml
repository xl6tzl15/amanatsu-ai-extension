          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/debug/tree:
    get:
      summary: "GameObject hierarchy, depth first, with instance id, active state, child count and component types; page with offset and next"
      x-mutates: false
      x-scene: "any"
      parameters:
        - in: "query"
          name: "scene"
          required: false
          schema:
            type: "string"
          description: "scene name from debug/scenes (default: every loaded scene)"
        - in: "query"
          name: "id"
          required: false
          schema:
            type: "integer"
          description: "start at this GameObject or component instead"
        - in: "query"
          name: "path"
          required: false
          schema:
            type: "string"
          description: "or at this object path, e.g. CustomScene/UI/Root"
        - in: "query"
          name: "depth"
          required: false
          schema:
            type: "integer"
            minimum: 0
            maximum: 64
            default: 3
        - in: "query"
          name: "filter"
          required: false
          schema:
            type: "string"
          description: "only objects whose name or a component type contains this; each result carries its path"
        - in: "query"
          name: "components"
          required: false
          schema:
            type: "boolean"
            default: true
        - in: "query"
          name: "offset"
          required: false
          schema:
            type: "integer"
            minimum: 0
            default: 0
        - in: "query"
          name: "limit"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "The object or scene was not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
