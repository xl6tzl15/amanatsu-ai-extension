openapi: "3.1.0"
info:
  title: "Amanatsu AI Extension"
  version: "0.9.2"
  description: "Local loopback API for Amanatsu Location. Generated from api_endpoints.json by gen_openapi.py; do not edit by hand. See AI_API_SPEC.md for workflow and safety constraints."
servers:
  - url: "http://127.0.0.1:38427"
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "string"
      required:
        - "error"
    Color:
      type: "array"
      minItems: 3
      maxItems: 4
      items:
        type: "number"
        minimum: 0
        maximum: 1
      description: "[r,g,b] or [r,g,b,a] in 0..1"
    Vector3:
      type: "array"
      minItems: 3
      maxItems: 3
      items:
        type: "number"
    Vector3Rate:
      type: "array"
      minItems: 3
      maxItems: 3
      items:
        type: "number"
        minimum: 0
        maximum: 1
    Region:
      type: "string"
      enum:
        - "face"
        - "bust"
        - "upper_body"
        - "waist"
        - "legs"
        - "full"
    View:
      type: "string"
      enum:
        - "front"
        - "back"
        - "left"
        - "right"
        - "top"
        - "bottom"
    KitRegion:
      type: "string"
      enum:
        - "outline"
        - "eyes"
        - "brows"
        - "nose"
        - "mouth"
        - "hair"
    CardFile:
      type: "string"
      pattern: "^[^/\\\\]+[.]png$"
      description: "file name in UserData/chara/female"
    BooleanState:
      type: "object"
      properties:
        enabled:
          type: "boolean"
      required:
        - "enabled"
    CharacterTarget:
      type: "object"
      properties:
        uniqueId:
          type: "integer"
        listIndex:
          type: "integer"
          minimum: 0
        name:
          type: "string"
      description: "identify the character by one of uniqueId, listIndex or name"
    Operation:
      type: "object"
      properties:
        path:
          type: "string"
          description: "POST endpoint relative to /api/v1/"
        body:
          type: "object"
      required:
        - "path"
        - "body"
paths:
  /api/v1/schema:
    get:
      summary: "Every endpoint with its body (this list)"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/state:
    get:
      summary: "Scene and whether the character creator is ready"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/navigate:
    post:
      summary: "One step toward the target screen per call; repeat until done:true"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                target:
                  type: "string"
                  enum:
                    - "female-creator"
              required:
                - "target"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/logs:
    get:
      summary: "Recent operation log entries"
      parameters:
        - in: "query"
          name: "limit"
          required: false
          schema:
            type: "integer"
            minimum: 1
            default: 100
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ui/buttons:
    get:
      summary: "Active Unity buttons"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ui/click:
    post:
      summary: "Click a button from ui/buttons"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                id:
                  type: "integer"
              required:
                - "id"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ui/toggles:
    get:
      summary: "Active Unity toggles"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ui/toggle:
    post:
      summary: "Set a toggle from ui/toggles"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                id:
                  type: "integer"
                value:
                  type: "boolean"
              required:
                - "id"
                - "value"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ui/input-sliders:
    get:
      summary: "Maker numeric inputs with their on-screen Japanese label and order"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ui/input-slider:
    post:
      summary: "Type into a maker numeric input through its real onEndEdit path"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                id:
                  type: "integer"
                text:
                  type: "string"
              required:
                - "id"
                - "text"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/screenshot:
    get:
      summary: "Current screen as base64 PNG"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/camera/landmarks:
    get:
      summary: "World-space skeleton positions and face bounds"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/camera/frame:
    post:
      summary: "Point the maker camera at a body region"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                region:
                  $ref: "#/components/schemas/Region"
                view:
                  $ref: "#/components/schemas/View"
              required:
                - "region"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/capture:
    post:
      summary: "Frame, wait for the render and return framing metadata with image.pngBase64; optional expression and pose apply only for the shot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                region:
                  $ref: "#/components/schemas/Region"
                view:
                  $ref: "#/components/schemas/View"
                expression:
                  type: "object"
                  properties:
                    eyebrow:
                      type: "integer"
                      minimum: 0
                    eyes:
                      type: "integer"
                      minimum: 0
                    mouth:
                      type: "integer"
                      minimum: 0
                pose:
                  oneOf:
                    - type: "string"
                    - type: "integer"
                  description: "state name or index from creator/poses"
              required:
                - "region"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/self-shadow:
    get:
      summary: "Self-shadow state (companion plugin)"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Turn self-shadow on or off"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooleanState"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/slider-unlock:
    get:
      summary: "Extended slider range state (companion plugin)"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Turn the extended slider range on or off"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BooleanState"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/favorability:
    get:
      summary: "Character parameter state"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Change a character's favorability"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CharacterTarget"
                - type: "object"
                  properties:
                    point:
                      type: "integer"
                    delta:
                      type: "integer"
                    level:
                      type: "integer"
                    isMaxLevel:
                      type: "boolean"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/character-parameters:
    get:
      summary: "Character parameter state"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Change a character parameter, gauge stage, scene unlocks or realtime outfit"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CharacterTarget"
                - type: "object"
                  properties:
                    parameter:
                      type: "string"
                      enum:
                        - "favorability"
                        - "inclusiveness"
                        - "proactivity"
                        - "curiosity"
                    point:
                      type: "integer"
                    delta:
                      type: "integer"
                    level:
                      type: "integer"
                    isMaxLevel:
                      type: "boolean"
                    gaugeStageIndex:
                      type: "integer"
                      minimum: 0
                      maximum: 11
                    gaugeStage:
                      type: "integer"
                      minimum: 0
                      maximum: 6
                    nightEventCount:
                      type: "integer"
                    hCount:
                      type: "integer"
                    massageCount:
                      type: "integer"
                    latePoint:
                      type: "integer"
                    cost:
                      type: "integer"
                    unlockScenes:
                      type: "boolean"
                    coordinateType: {}
                    clothesPart: {}
                    clothesState: {}
                    accessorySlot:
                      type: "integer"
                    accessoryVisible:
                      type: "boolean"
                    allAccessoriesVisible:
                      type: "boolean"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/realtime-outfit:
    get:
      summary: "Character state including realtime outfit data"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Change a character's current outfit state"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CharacterTarget"
                - type: "object"
                  properties:
                    coordinateType:
                      oneOf:
                        - type: "integer"
                          enum:
                            - 0
                            - 1
                        - type: "string"
                          enum:
                            - "swimsuit"
                            - "afterBath"
                    clothesPart:
                      oneOf:
                        - type: "integer"
                          minimum: 0
                          maximum: 7
                        - type: "string"
                          enum:
                            - "top"
                            - "bottom"
                            - "bra"
                            - "shorts"
                            - "gloves"
                            - "pantyhose"
                            - "socks"
                            - "shoes"
                    clothesState:
                      oneOf:
                        - type: "integer"
                          minimum: 0
                          maximum: 2
                        - type: "string"
                          enum:
                            - "clothing"
                            - "halfUndress"
                            - "naked"
                    accessorySlot:
                      type: "integer"
                      minimum: 0
                    accessoryVisible:
                      type: "boolean"
                    allAccessoriesVisible:
                      type: "boolean"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/character:
    get:
      summary: "Current character shape arrays and part IDs"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/character/shape:
    post:
      summary: "Set one shape value (creator/shapes sets many at once)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                region:
                  type: "string"
                  enum:
                    - "body"
                    - "face"
                index:
                  type: "integer"
                  minimum: 0
                value:
                  type: "number"
                  minimum: -5
                  maximum: 5
              required:
                - "region"
                - "index"
                - "value"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/character/choice:
    post:
      summary: "Choose a head, hair or clothes part by catalog id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                kind:
                  type: "string"
                  enum:
                    - "head"
                    - "hair_back"
                    - "hair_front"
                    - "hair_side"
                    - "hair_option"
                    - "clothes_top"
                    - "clothes_bot"
                    - "clothes_bra"
                    - "clothes_shorts"
                    - "clothes_gloves"
                    - "clothes_panst"
                    - "clothes_socks"
                    - "clothes_shoes"
                    - "clothes_add_arm"
                    - "clothes_add_leg"
                    - "clothes_add_other"
                id:
                  type: "integer"
              required:
                - "kind"
                - "id"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/catalog:
    get:
      summary: "Sorted choices of a game category (bo_head, bo_hair_f, co_bot, ao_*, mt_* ...)"
      parameters:
        - in: "query"
          name: "category"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/cards:
    get:
      summary: "Character cards in UserData/chara/female"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/card:
    get:
      summary: "Read a saved card without loading it"
      parameters:
        - in: "query"
          name: "file"
          required: true
          schema:
            type: "string"
          description: "relative png path from cards"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/creator/details:
    get:
      summary: "Profile, named shape indices, colors, coordinate parts, accessory slots and tabs"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/creator/diagnostics:
    get:
      summary: "Loaded Human objects"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/creator/shape-guide:
    get:
      summary: "Every face/body slider in maker order with its Japanese label and what raising or lowering it does"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/creator/shapes:
    post:
      summary: "Set many face/body shape values at once (validated as a whole, one model refresh)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                face:
                  type: "object"
                  additionalProperties:
                    type: "number"
                    minimum: -5
                    maximum: 5
                  description: "name or index: value"
                body:
                  type: "object"
                  additionalProperties:
                    type: "number"
                    minimum: -5
                    maximum: 5
                  description: "name or index: value"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/creator/params:
    get:
      summary: "Detailed maker values with increase/decrease notes for face and body"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: "Set detailed maker values (all validated first; rolled back if one fails); without values it reads with the given selectors"
