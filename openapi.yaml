openapi: "3.1.0"
info:
  title: "Amanatsu AI Extension"
  version: "0.10.0"
  description: "Local loopback API for Amanatsu Location. Generated from api_endpoints.json by gen_openapi.py; do not edit by hand. See AI_API_SPEC.md for workflow and safety constraints."
servers:
  - url: "http://127.0.0.1:38427"
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "string"
      required:
        - "error"
    Color:
      type: "array"
      minItems: 3
      maxItems: 4
      items:
        type: "number"
        minimum: 0
        maximum: 1
      description: "[r,g,b] or [r,g,b,a] in 0..1"
    Vector3:
      type: "array"
      minItems: 3
      maxItems: 3
      items:
        type: "number"
    Vector3Rate:
      type: "array"
      minItems: 3
      maxItems: 3
      items:
        type: "number"
        minimum: 0
        maximum: 1
    Region:
      type: "string"
      enum:
        - "face"
        - "bust"
        - "upper_body"
        - "waist"
        - "legs"
        - "full"
    View:
      type: "string"
      enum:
        - "front"
        - "back"
        - "left"
        - "right"
        - "top"
        - "bottom"
    KitRegion:
      type: "string"
      enum:
        - "outline"
        - "eyes"
        - "brows"
        - "nose"
        - "mouth"
        - "hair"
    CardFile:
      type: "string"
      pattern: "^[^/\\\\]+[.]png$"
      description: "file name in UserData/chara/female"
    BooleanState:
      type: "object"
      properties:
        enabled:
          type: "boolean"
      required:
        - "enabled"
    CharacterTarget:
      type: "object"
      properties:
        uniqueId:
          type: "integer"
        listIndex:
          type: "integer"
          minimum: 0
        name:
          type: "string"
      oneOf:
        - required:
            - "uniqueId"
        - required:
            - "listIndex"
        - required:
            - "name"
      description: "identify the character by exactly one of uniqueId, listIndex or name"
    ButtonSelector:
      type: "object"
      properties:
        name:
          type: "string"
          description: "GameObject name"
        text:
          type: "string"
          description: "label text"
        path:
          type: "string"
          description: "whole object path or its trailing segments, e.g. Canvas/Menu/Start"
        index:
          type: "integer"
          minimum: 0
          description: "which match when several buttons match"
      anyOf:
        - required:
            - "name"
        - required:
            - "text"
        - required:
            - "path"
      description: "a visible button matched by every given property (at least one of name, text, path)"
    WaitResult:
      type: "object"
      properties:
        satisfied:
          type: "boolean"
        elapsedMs:
          type: "integer"
        frames:
          type: "integer"
        state:
          type: "object"
          properties:
            scene:
              type: "string"
            humanCount:
              type: "integer"
            creatorReady:
              type: "boolean"
        log:
          type:
            - "object"
            - "null"
          description: "the debug/log entry that met the log condition"
        logCursor:
          type: "integer"
        event:
          type:
            - "object"
            - "null"
          description: "the debug/events entry that met the event condition"
        eventCursor:
          type: "integer"
        error:
          type:
            - "string"
            - "null"
      required:
        - "satisfied"
        - "elapsedMs"
        - "frames"
        - "state"
      description: "debug/wait result"
    KitApplyResult:
      type: "object"
      properties:
        applied:
          $ref: "#/components/schemas/KitRegion"
        name:
          type: "string"
        exclude:
          type: "array"
          items:
            type: "string"
        changes:
          type: "array"
        failures:
          type: "integer"
        results:
          type: "array"
      required:
        - "applied"
        - "name"
        - "failures"
        - "results"
      description: "creator/kit-apply result; results lists each failed operation with its path, status and body"
    KitDryRunResult:
      type: "object"
      properties:
        dryRun:
          const: true
        region:
          $ref: "#/components/schemas/KitRegion"
        name:
          type: "string"
        exclude:
          type: "array"
          items:
            type: "string"
        changes:
          type: "array"
      required:
        - "dryRun"
        - "region"
        - "name"
        - "changes"
      description: "creator/kit-apply with dryRun: the field changes it would make"
    Operation:
      type: "object"
      properties:
        path:
          type: "string"
          description: "POST endpoint relative to /api/v1/"
        body:
          type: "object"
      required:
        - "path"
        - "body"
paths:
  /api/v1/schema:
    get:
      summary: "Every endpoint with its body (this list), followed by the endpoints other plugins registered under ext/"
      x-mutates: false
      x-scene: "any"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/extensions:
    get:
      summary: "Plugins that registered endpoints under ext/{owner}/, and registrations that were rejected with the reason"
      x-mutates: false
      x-scene: "any"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/state:
    get:
      summary: "Scene and whether the character creator is ready"
      x-mutates: false
      x-scene: "any"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
