        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/navigate:
    post:
      summary: "One step toward the target screen per call; repeat until done:true"
      x-mutates: true
      x-scene: "any"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                target:
                  type: "string"
                  enum:
                    - "female-creator"
              required:
                - "target"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "A capture is in progress"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/logs:
    get:
      summary: "Recent operation log entries"
      x-mutates: false
      x-scene: "any"
      parameters:
        - in: "query"
          name: "limit"
          required: false
          schema:
            type: "integer"
            minimum: 1
            default: 100
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/debug/plugins:
    get:
      summary: "Loaded BepInEx plugins with GUID, version, DLL path and file time (check that a new build is the one running)"
      x-mutates: false
      x-scene: "any"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/debug/log:
    get:
      summary: "BepInEx log of every plugin and Unity, including lines from before this plugin loaded; pass next back as since to read only new lines"
      x-mutates: false
      x-scene: "any"
      parameters:
        - in: "query"
          name: "since"
          required: false
          schema:
            type: "integer"
            minimum: 0
            default: 0
          description: "cursor from a previous response's next"
        - in: "query"
          name: "limit"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 1000
            default: 200
        - in: "query"
          name: "level"
          required: false
          schema:
            type: "string"
            enum:
              - "fatal"
              - "error"
              - "warning"
              - "message"
              - "info"
              - "debug"
          description: "this level and more severe"
        - in: "query"
          name: "source"
          required: false
          schema:
            type: "string"
          description: "substring of the log source name"
        - in: "query"
          name: "contains"
          required: false
          schema:
            type: "string"
          description: "substring of the message"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: "Request body over 4 MiB"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "The game's main thread did not answer within ten seconds"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/debug/harmony:
    get:
      summary: "Patched methods with every prefix, postfix, transpiler and finalizer and the Harmony id that applied it; shared:true when several owners patch one method"
      x-mutates: false
      x-scene: "any"
      parameters:
        - in: "query"
          name: "owner"
          required: false
          schema:
            type: "string"
          description: "substring of a Harmony owner id or of the patching assembly name"
        - in: "query"
          name: "target"
          required: false
          schema:
            type: "string"
          description: "substring of Type.Method"
      responses:
        "200":
          description: "OK"
        "400":
          description: "Invalid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Missing or wrong bearer token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not a loopback request, or an Origin header was sent"
          content:
            application/json:
